services:
  - type: web
    name: fraudlens-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: MODEL_DIR
        value: ./artifacts
      - key: MAX_UPLOAD_BYTES
        value: "314572800"
      - key: MAX_UPLOAD_ROWS
        value: "300000"
