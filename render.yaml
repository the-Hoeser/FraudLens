services:
  - type: web
    name: fraudlens-api
    runtime: docker
    plan: free
    region: singapore
    autoDeployTrigger: checksPass
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "https://fraudlens-ai-lsou.netlify.app,http://localhost:5173,http://127.0.0.1:5173"
      - key: CORS_ORIGIN_REGEX
        value: "^https://(?:[a-z0-9-]+--)?fraudlens-ai-lsou\\.netlify\\.app$"
      - key: MODEL_DIR
        value: ./artifacts
      - key: MAX_UPLOAD_BYTES
        value: "314572800"
      - key: MAX_UPLOAD_ROWS
        value: "300000"
