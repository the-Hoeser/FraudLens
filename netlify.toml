"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  base = "frontend"
  command = "bun install && bun run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"
  BUN_VERSION = "1.3.14"
  VITE_DEMO_MODE = "false"
  VITE_API_BASE_URL = "https://fraudlens-api-vllp.onrender.com"
